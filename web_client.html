<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Agent - Web Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }
        
        .tab-button {
            padding: 12px 24px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: 600;
        }
        
        .tab-button:hover {
            color: #667eea;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .result-area {
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 6px;
            border: 2px solid #eee;
            display: none;
        }
        
        .result-area.active {
            display: block;
        }
        
        .result-content {
            white-space: pre-wrap;
            line-height: 1.6;
            color: #333;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            display: none;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .status {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Career Agent</h1>
            <p>AI-Powered Career Materials Generator</p>
        </div>
        
        <div class="content">
            <div id="status" class="status"></div>
            
            <div class="tab-buttons">
                <button class="tab-button active" onclick="switchTab('cover-letter')">Cover Letter</button>
                <button class="tab-button" onclick="switchTab('blurb')">Blurb</button>
                <button class="tab-button" onclick="switchTab('query')">Query</button>
            </div>
            
            <!-- Cover Letter Tab -->
            <div id="cover-letter" class="tab-content active">
                <form onsubmit="generateCoverLetter(event)">
                    <div class="form-group">
                        <label>Company Name *</label>
                        <input type="text" id="company" required placeholder="e.g., Google">
                    </div>
                    
                    <div class="form-group">
                        <label>Role Title *</label>
                        <input type="text" id="role" required placeholder="e.g., Senior Product Manager">
                    </div>
                    
                    <div class="form-group">
                        <label>Job Description (Optional)</label>
                        <textarea id="job-desc" placeholder="Paste job description or key requirements..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Additional Context (Optional)</label>
                        <textarea id="additional-context" placeholder="Any additional context you want the agent to consider (e.g., specific requirements, company culture, connection details, etc.)..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Tone</label>
                        <select id="tone">
                            <option value="professional">Professional</option>
                            <option value="friendly">Friendly</option>
                            <option value="formal">Formal</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Length</label>
                        <select id="length">
                            <option value="short">Short (2-3 paragraphs)</option>
                            <option value="medium" selected>Medium (4-5 paragraphs)</option>
                            <option value="long">Long (6+ paragraphs)</option>
                        </select>
                    </div>
                    
                    <div class="button-group">
                        <button type="submit" class="btn-primary">Generate Cover Letter</button>
                        <button type="button" class="btn-secondary" onclick="clearResult()">Clear</button>
                    </div>
                </form>
            </div>
            
            <!-- Blurb Tab -->
            <div id="blurb" class="tab-content">
                <form onsubmit="generateBlurb(event)">
                    <div class="form-group">
                        <label>Purpose *</label>
                        <input type="text" id="purpose" required placeholder="e.g., LinkedIn introduction">
                    </div>
                    
                    <div class="form-group">
                        <label>Target Role (Optional)</label>
                        <input type="text" id="target-role" placeholder="e.g., Engineering Manager">
                    </div>
                    
                    <div class="form-group">
                        <label>Max Words</label>
                        <input type="number" id="max-words" value="200" min="50" max="500">
                    </div>
                    
                    <div class="form-group">
                        <label>Style</label>
                        <select id="style">
                            <option value="linkedin">LinkedIn</option>
                            <option value="email">Email</option>
                            <option value="professional">Professional</option>
                        </select>
                    </div>
                    
                    <div class="button-group">
                        <button type="submit" class="btn-primary">Generate Blurb</button>
                        <button type="button" class="btn-secondary" onclick="clearResult()">Clear</button>
                    </div>
                </form>
            </div>
            
            <!-- Query Tab -->
            <div id="query" class="tab-content">
                <form onsubmit="sendQuery(event)">
                    <div class="form-group">
                        <label>Your Question *</label>
                        <textarea id="question" required placeholder="e.g., What are Ram's key achievements at ACE Hardware?"></textarea>
                    </div>
                    
                    <div class="button-group">
                        <button type="submit" class="btn-primary">Send Query</button>
                        <button type="button" class="btn-secondary" onclick="clearResult()">Clear</button>
                    </div>
                </form>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Generating content... This may take 10-20 seconds.</p>
            </div>
            
            <div class="result-area" id="result">
                <h3>Generated Content:</h3>
                <div class="result-content" id="result-content"></div>
                <div style="margin-top: 15px;">
                    <button class="btn-secondary" onclick="copyToClipboard()">Copy to Clipboard</button>
                    <button class="btn-secondary" onclick="downloadResult()">Download as Text</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE_URL = 'http://localhost:8000';
        
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            setTimeout(() => {
                statusDiv.classList.remove('success', 'error');
            }, 5000);
        }
        
        function showLoading() {
            document.getElementById('loading').classList.add('active');
            document.getElementById('result').classList.remove('active');
        }
        
        function hideLoading() {
            document.getElementById('loading').classList.remove('active');
        }
        
        function showResult(content) {
            document.getElementById('result-content').textContent = content;
            document.getElementById('result').classList.add('active');
            document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
        }
        
        function clearResult() {
            document.getElementById('result').classList.remove('active');
            document.getElementById('result-content').textContent = '';
        }
        
        async function generateCoverLetter(event) {
            event.preventDefault();
            showLoading();
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/v1/cover-letter`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        company_name: document.getElementById('company').value,
                        role_title: document.getElementById('role').value,
                        job_description: document.getElementById('job-desc').value || null,
                        additional_context: document.getElementById('additional-context').value || null,
                        tone: document.getElementById('tone').value,
                        length: document.getElementById('length').value,
                        format: 'text'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showResult(data.content);
                    showStatus('Cover letter generated successfully!', 'success');
                } else {
                    throw new Error('Generation failed');
                }
            } catch (error) {
                showStatus(`Error: ${error.message}. Make sure the API server is running!`, 'error');
                console.error(error);
            } finally {
                hideLoading();
            }
        }
        
        async function generateBlurb(event) {
            event.preventDefault();
            showLoading();
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/v1/blurb`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        purpose: document.getElementById('purpose').value,
                        target_role: document.getElementById('target-role').value || null,
                        max_words: parseInt(document.getElementById('max-words').value),
                        style: document.getElementById('style').value,
                        format: 'text'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showResult(data.content);
                    showStatus('Blurb generated successfully!', 'success');
                } else {
                    throw new Error('Generation failed');
                }
            } catch (error) {
                showStatus(`Error: ${error.message}. Make sure the API server is running!`, 'error');
                console.error(error);
            } finally {
                hideLoading();
            }
        }
        
        async function sendQuery(event) {
            event.preventDefault();
            showLoading();
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/v1/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: document.getElementById('question').value,
                        format: 'text'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showResult(data.content);
                    showStatus('Query processed successfully!', 'success');
                } else {
                    throw new Error('Query failed');
                }
            } catch (error) {
                showStatus(`Error: ${error.message}. Make sure the API server is running!`, 'error');
                console.error(error);
            } finally {
                hideLoading();
            }
        }
        
        function copyToClipboard() {
            const content = document.getElementById('result-content').textContent;
            navigator.clipboard.writeText(content).then(() => {
                showStatus('Copied to clipboard!', 'success');
            });
        }
        
        function downloadResult() {
            const content = document.getElementById('result-content').textContent;
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `career_agent_${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showStatus('Download started!', 'success');
        }
        
        // Check API connection on load
        window.addEventListener('load', async () => {
            try {
                const response = await fetch(`${API_BASE_URL}/health`);
                const data = await response.json();
                if (data.agent_initialized) {
                    showStatus('✅ Connected to Career Agent API', 'success');
                }
            } catch (error) {
                showStatus('⚠️ Cannot connect to API server. Make sure it is running on port 8000.', 'error');
            }
        });
    </script>
</body>
</html>
