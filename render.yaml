services:
  - type: web
    name: career-agent-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server_multi_tenant:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: DATABASE_URL
        value: sqlite:///./career_agent.db
        # For PostgreSQL: value: postgresql://user:password@hostname:5432/dbname
    healthCheckPath: /health
    autoDeploy: true

