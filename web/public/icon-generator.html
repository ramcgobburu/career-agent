<!DOCTYPE html>
<html>
<head>
  <title>Icon Generator</title>
  <style>
    body {
      font-family: system-ui;
      padding: 2rem;
      max-width: 800px;
      margin: 0 auto;
    }
    .icon-preview {
      width: 192px;
      height: 192px;
      background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 4rem;
      font-weight: bold;
      margin: 1rem 0;
      box-shadow: 0 4px 16px rgba(14, 165, 233, 0.3);
    }
    .icon-preview.large {
      width: 512px;
      height: 512px;
      font-size: 10rem;
    }
    canvas {
      border: 1px solid #ddd;
      margin: 1rem 0;
    }
    button {
      background: #0ea5e9;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      margin: 0.5rem 0.5rem 0.5rem 0;
    }
    button:hover {
      background: #0284c7;
    }
  </style>
</head>
<body>
  <h1>PWA Icon Generator</h1>
  <p>This page helps you generate icons for the PWA. For production, you should create proper icon files.</p>
  
  <h2>192x192 Icon</h2>
  <div class="icon-preview">CP</div>
  <canvas id="canvas192" width="192" height="192"></canvas>
  <button onclick="downloadIcon(192)">Download 192x192</button>
  
  <h2>512x512 Icon</h2>
  <div class="icon-preview large">CP</div>
  <canvas id="canvas512" width="512" height="512"></canvas>
  <button onclick="downloadIcon(512)">Download 512x512</button>
  
  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      
      // Background gradient
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#0ea5e9');
      gradient.addColorStop(1, '#3b82f6');
      
      // Rounded rectangle background
      const radius = size * 0.125; // 12.5% of size
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fill();
      
      // Text
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${size * 0.4}px Inter, system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('CP', size / 2, size / 2);
    }
    
    function downloadIcon(size) {
      const canvas = document.getElementById(`canvas${size}`);
      drawIcon(canvas, size);
      
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `icon-${size}.png`;
        a.click();
        URL.revokeObjectURL(url);
      });
    }
    
    // Draw icons on load
    window.onload = () => {
      drawIcon(document.getElementById('canvas192'), 192);
      drawIcon(document.getElementById('canvas512'), 512);
    };
  </script>
</body>
</html>
