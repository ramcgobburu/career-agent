<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate PNG Icons from SVG</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #0f172a;
      margin-bottom: 10px;
    }
    p {
      color: #64748b;
      margin-bottom: 20px;
    }
    .preview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }
    .preview-item {
      text-align: center;
      padding: 20px;
      background: #f8fafc;
      border-radius: 8px;
    }
    .preview-item canvas {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    button {
      background: linear-gradient(to right, #14b8a6, #10b981);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin: 5px;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      background: #ecfdf5;
      border-left: 4px solid #10b981;
      border-radius: 4px;
      color: #065f46;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 CareerPilot Icon Generator</h1>
    <p>Generate PNG icons from SVG for PWA and favicons. Click the buttons below to download.</p>
    
    <div class="preview">
      <div class="preview-item">
        <h3>192x192</h3>
        <canvas id="canvas192" width="192" height="192"></canvas>
        <button onclick="downloadIcon(192)">Download 192x192</button>
      </div>
      <div class="preview-item">
        <h3>512x512</h3>
        <canvas id="canvas512" width="512" height="512"></canvas>
        <button onclick="downloadIcon(512)">Download 512x512</button>
      </div>
      <div class="preview-item">
        <h3>32x32 (Favicon)</h3>
        <canvas id="canvas32" width="32" height="32"></canvas>
        <button onclick="downloadIcon(32)">Download 32x32</button>
      </div>
    </div>
    
    <div id="status"></div>
  </div>

  <script>
    const svgUrl = '/icon.svg';
    
    function loadSVG(url, callback) {
      fetch(url)
        .then(response => response.text())
        .then(svgText => {
          const parser = new DOMParser();
          const svgDoc = parser.parseFromString(svgText, 'image/svg+xml');
          const svgElement = svgDoc.documentElement;
          callback(svgElement);
        })
        .catch(err => {
          console.error('Error loading SVG:', err);
          document.getElementById('status').innerHTML = 
            '<div class="status">Error loading SVG. Make sure icon.svg exists in the public folder.</div>';
        });
    }
    
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      loadSVG(svgUrl, (svgElement) => {
        svgElement.setAttribute('width', size);
        svgElement.setAttribute('height', size);
        
        const svgData = new XMLSerializer().serializeToString(svgElement);
        const img = new Image();
        const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);
        
        img.onload = function() {
          ctx.clearRect(0, 0, size, size);
          ctx.drawImage(img, 0, 0, size, size);
          URL.revokeObjectURL(url);
        };
        
        img.src = url;
      });
    }
    
    function downloadIcon(size) {
      const canvas = document.getElementById(`canvas${size}`);
      canvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `icon-${size}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        document.getElementById('status').innerHTML = 
          `<div class="status">✅ Downloaded icon-${size}.png successfully! Save it to the /public folder.</div>`;
      });
    }
    
    // Draw icons on load
    window.addEventListener('load', function() {
      drawIcon(document.getElementById('canvas192'), 192);
      drawIcon(document.getElementById('canvas512'), 512);
      drawIcon(document.getElementById('canvas32'), 32);
    });
  </script>
</body>
</html>
